[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enigmister"
version = "0.1.0"
description = "A browser sandbox for laying out crosswords by hand"
authors = [
    { name="Massimiliano Russo" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
enigmister = "enigmister.visualize:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
